name: baton
label: Voice Remote
kind: standalone
version: 1.0.0
author: 1maker
description: >
  Turn a Bluetooth voice remote into a Hermes input and control surface: hold the
  remote's voice key and speak -> local SenseVoice recognition -> the text lands in
  the current composer; the other keys map to submit / stop generation / new session /
  canned phrases. Remote models are data (sidecar/devices/*.json), so adding one needs
  no code change and no bridge rebuild. Both the Bluetooth link and recognition stay
  on this machine; audio is never uploaded.
requires_hermes: ">=0.22.5"
provides_tools:
  - baton
