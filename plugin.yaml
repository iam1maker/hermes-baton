name: baton
label: Baton
kind: standalone
version: 1.0.0
author: 1maker
description: >
  Turn a Bluetooth voice remote into a Hermes input and control surface: hold the
  remote's voice key and speak -> local SenseVoice recognition -> the text lands in
  the current composer; the other keys map to submit / stop generation / new session /
  canned phrases. Remote models are data (sidecar/devices/*.json), so adding one needs
  no code change and no bridge rebuild. Both the Bluetooth link and recognition stay
  on this machine; audio is never uploaded.
requires_hermes: ">=0.22.5"
provides_tools:
  - baton

# Secrets come from Hermes' credential store, never from the plugin's own settings file
# (catalog rule 11). Only an external recognition service needs this one; the local
# SenseVoice path runs without any credential.
requires_env:
  - name: BATON_STT_API_KEY
    description: "Token for an external OpenAI-compatible transcription service (optional; the local model needs no key)"
    prompt: "External STT API key (or empty)"
    password: true
