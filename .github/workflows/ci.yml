name: ci

# Everything here is hardware-free: the suites stub the SDK, React and the
# transport, so a plain runner proves the renderer engine, the device registry
# and the model-precision logic without Electron, a gateway or a remote.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref: a new push cancels the previous run instead of queueing behind it.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  build-and-test:
    # `main` and a manual dispatch always run. A pull request runs only once the owner adds the
    # `run-ci` label: `gh pr edit <n> --add-label run-ci`. A push that lands after the label needs
    # the label removed and re-added to run again -- a `workflow_dispatch` run reports its check
    # on the commit but does not satisfy the pull request's merge gate (measured: `mergeable_state`
    # stayed `blocked` after a successful dispatch).
    # `pull_request_target` runs the base branch's workflow but must test the pull request's
    # tree, so it executes untrusted code by design. That is contained: no secrets are
    # referenced anywhere in this file and the token is read-only, so the worst case is arbitrary
    # code on a throwaway runner -- and only after the owner asked for it.
    permissions:
      contents: read
    # Linux runner: nothing here needs macOS (the Swift bridge is not built in CI),
    # and esbuild 0.28.2 output is byte-identical across platforms, which is what
    # the dirty-tree check below relies on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `pull_request_target` checks out the base branch unless told otherwise.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the build toolchain
        working-directory: dev
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: node dev/typecheck.mjs

      - name: Build the runtime artifacts
        run: node dev/build.mjs

      - name: Refuse a dirty tree
        # The products are generated from src/, so a build that changes them
        # means a committed product is stale or a source edit forgot to rebuild.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "generated artifacts are out of date:";
            git status --short;
            exit 1;
          fi

      - name: Tests
        run: bash tests/run.sh

      - name: Syntax-check the shipped products
        run: |
          node --check sidecar/server.mjs
          node --check sidecar/stt/sensevoice.mjs
          node --check sidecar/devices/index.mjs
          node --check desktop/plugin.js

      - name: Repository stays ASCII outside the i18n payload
        run: python3 scripts/cjk-scan.py .
